<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quill.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Strategic Thinking, the Business Journal, and Research Journal. Books coming soon from Mindful Pages, with the Business Bloom app in development."
    />
    <link rel="canonical" href="https://mindfulpages.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mindful Pages — Books for the business you’re building" />
    <meta property="og:description" content="Explore Strategic Thinking, the Business Journal, and Research Journal. Practical books and guided journals for small-business owners. Coming soon." />
    <meta property="og:url" content="https://mindfulpages.app/" />
    <meta property="og:image" content="https://mindfulpages.app/images/mindful-pages-share.jpg" />
    <meta property="og:image:width" content="1200" /><meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mindful Pages books and journals for small-business owners" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mindful Pages — Books, Journals & Business Bloom</title>

    <!-- Fonts: Fraunces (elegant serif display) + Inter (clean modern sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection stub. Netlify scans the deployed static HTML for
      forms; our real form is rendered by React, so this hidden twin (same name
      + fields) lets Netlify register the "waitlist" form. Submissions from the
      React form then land in your Netlify dashboard → Forms → waitlist.
    -->
    <form name="waitlist" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="text" name="first-name" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <form name="book-updates" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="book-updates" type="hidden" />
      <input name="name" /><input name="email" type="email" />
      <input name="book-updates" /><input name="app-updates" /><input name="bot-field" />
    </form>
    <form name="reader-contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="reader-contact" type="hidden" />
      <input name="name" /><input name="email" type="email" />
      <input name="subject" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
