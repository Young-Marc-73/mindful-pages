# Netlify deploy config for Mindful Pages (Vite SPA)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Dedicated routes are prerendered to dist/<route>/index.html.
# Netlify serves those files directly; no SPA catch-all is needed.
# Netlify Forms processes POSTs to "/" before any redirects, so the waitlist
# form in index.html is detected and submissions land in Forms → "waitlist".

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/strategic-thinking/download*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
